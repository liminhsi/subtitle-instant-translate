<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>字幕即时译</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <div>
        <p class="brand">字幕即时译</p>
        <h1>日语字幕，提前译好</h1>
      </div>
      <label class="switch">
        <input id="enabled" type="checkbox" />
        <span>开</span>
      </label>
    </header>
    <p id="status" class="status">正在连接模型…</p>
    <label class="field">
      <span>原片语言</span>
      <select id="source"></select>
    </label>
    <label class="field">
      <span>译成</span>
      <select id="target"></select>
    </label>
    <label class="check"><input id="show-original" type="checkbox" />显示原文</label>
    <label class="check"><input id="hide-site" type="checkbox" />译文出来后隐藏网站字幕</label>
    <label class="field">
      <span>字体</span>
      <select id="font-style"></select>
    </label>
    <label class="field">
      <span>背景</span>
      <select id="background-style"></select>
    </label>
    <label class="field range">
      <span>字号 <b id="font-value">28</b></span>
      <input id="font-size" type="range" min="16" max="72" step="1" />
    </label>
    <label class="field range">
      <span>背景浓淡 <b id="bg-alpha-value">66</b>%</span>
      <input id="bg-alpha" type="range" min="0" max="100" step="5" />
    </label>
    <label class="field range">
      <span>文字浓淡 <b id="text-alpha-value">100</b>%</span>
      <input id="text-alpha" type="range" min="35" max="100" step="5" />
    </label>
    <label class="field range">
      <span>距底部 <b id="bottom-value">12</b>%</span>
      <input id="bottom" type="range" min="4" max="40" step="1" />
    </label>
    <label class="field range">
      <span>时间微调 <b id="offset-value">0.0</b> 秒</span>
      <input id="offset" type="range" min="-5" max="5" step="0.1" />
    </label>
    <div class="actions">
      <button id="setup" type="button">下载翻译模型</button>
      <button id="upload-srt" type="button">上传本地 SRT</button>
      <button id="player" type="button">打开本地播放器</button>
    </div>
    <p id="note" class="note"></p>
    <footer>
      <p>播放时画面上只留字幕。暂停后，鼠标移到画面上可以更换 SRT，也可以把文件拖到视频上。</p>
      <p>字幕快捷键：Alt+↑↓ 字号，Alt+Shift+↑↓ 位置，Alt+-/= 背景浓淡，Alt+[ / ] 文字浓淡，Alt+B 背景，Alt+G 字体。开关翻译是 Alt+Shift+J。</p>
    </footer>
    <script src="../lib/settings.js"></script>
    <script src="../lib/style.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
